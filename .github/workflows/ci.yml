name: CI

on:
  push:
    branches: [main, staging]
  pull_request:

# Every job only checks out and tests the code. Without this block the token
# gets the repository's default permissions, which can include write access.
# The Playwright report upload uses the runner's own token, not this one.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    # Skips runs that would test code already tested:
    # - a pull_request run of the staging → main PR: the push run on staging
    #   already tests the same commit;
    # - the release-please version PR (branch release-please--…) and its merge
    #   into staging, "Merge pull request … release-please--" (merge) or
    #   "chore(staging): version X.Y.Z" (squash): package.json and CHANGELOG.md
    #   only, the code was checked on the previous push.
    # Defined once here (&run-ci), reused by the other jobs (*run-ci).
    if: &run-ci >-
      ${{ !(
            (github.event_name == 'pull_request' &&
             (github.head_ref == 'staging' || startsWith(github.head_ref, 'release-please--'))) ||
            (github.event_name == 'push' &&
             (startsWith(github.event.head_commit.message, 'chore(staging): version ') ||
              contains(github.event.head_commit.message, 'release-please--branches--')))
          ) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm exec tsc --noEmit

  # README.md and the docs exist in English and French (<name>.fr.md): a PR
  # that changes one language and not the other fails here. See the script
  # for the `Docs-Sync: skip` escape hatch. Pull requests only, minus the same
  # release PRs as above.
  docs:
    name: Docs fr/en in sync
    if: >-
      ${{ github.event_name == 'pull_request' &&
          github.head_ref != 'staging' &&
          !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check translated docs
        env:
          BASE_REF: ${{ github.base_ref }}
        run: bash .github/check-doc-pairs.sh "origin/$BASE_REF"

  # Decides whether the integration and e2e tests (about 5 minutes) need to
  # run. On a pull request whose files can't change the site (docs, Markdown,
  # .claude/, GitHub config other than this file), they are skipped: see
  # .github/ci-site-changed.sh, which lists what is safe rather than what is
  # risky. Pushes to staging and main always run everything — that's what
  # Vercel deploys. A skipped job counts as passed for required checks, which
  # skipping the whole workflow with `paths:` wouldn't.
  changes:
    name: Changes
    if: *run-ci
    runs-on: ubuntu-latest
    outputs:
      site: ${{ steps.decide.outputs.site }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Decide which tests to run
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            bash .github/ci-site-changed.sh "origin/$BASE_REF"
          else
            echo "site=true" >> "$GITHUB_OUTPUT"
            echo "Push to $GITHUB_REF_NAME: running every test." >> "$GITHUB_STEP_SUMMARY"
          fi

  unit:
    name: Unit tests
    if: *run-ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails under the 90% thresholds set in vitest.config.mts.
      - name: Unit tests with coverage
        run: pnpm test:coverage

  integration:
    name: Integration tests
    needs: changes
    # Fail closed: skipped only when Changes ran, succeeded and said "false".
    # If it failed, the tests run anyway; if it was skipped (the release PRs
    # above), so are they.
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped' &&
          !(needs.changes.result == 'success' && needs.changes.outputs.site == 'false') }}
    runs-on: ubuntu-latest
    # Matches .env.test, so the suite runs with no CI-specific config. The
    # database starts empty: the suite's global setup builds it from the
    # migrations alone, which is also the check that a fresh `payload migrate`
    # — a new environment, a preview branch — still works.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payload-portfolio-test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Integration tests
        run: pnpm test:int

  e2e:
    name: E2E tests
    needs: changes
    # Fail closed: skipped only when Changes ran, succeeded and said "false".
    # If it failed, the tests run anyway; if it was skipped (the release PRs
    # above), so are they.
    if: >-
      ${{ !cancelled() && needs.changes.result != 'skipped' &&
          !(needs.changes.result == 'success' && needs.changes.outputs.site == 'false') }}
    runs-on: ubuntu-latest
    # Matches .env.e2e. The Playwright web server (tests/e2e/serve.ts) builds
    # the database from the migrations, seeds it, then runs `next build` and
    # `next start` against it — the same production build Vercel deploys.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payload-portfolio-e2e-test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
